spring.application.name=ticketgenie-backend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ticketgenie}
spring.datasource.username=${DATABASE_USERNAME:ticketgenie}
spring.datasource.password=${DATABASE_PASSWORD:ticketgenie}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.time-zone=UTC
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWxvbmctZGVmYXVsdC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWNoYW5nZS1pdC0yMDI2}
app.jwt.expiration=86400000
app.reservation.minutes=${RESERVATION_MINUTES:5}
app.usdc.processing-seconds=30
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
server.error.include-message=never
