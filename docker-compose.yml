services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketgenie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketgenie
      POSTGRES_USER: ticketgenie
      POSTGRES_PASSWORD: ticketgenie
    ports:
      - "5432:5432"
    volumes:
      - ticketgenie_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketgenie -d ticketgenie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticketgenie_postgres:
